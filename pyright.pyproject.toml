[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
reportUnnecessaryTypeIgnoreComment = "error"
include = [
    "src/nrc/utils",
    "src/nrc/accounts",
    "src/nrc/datamodel",
    "src/nrc/setup_configuration",
]
exclude = [
    "src/nrc/**/migrations",
    "src/nrc/**/tests",
    "src/nrc/**/management",
]